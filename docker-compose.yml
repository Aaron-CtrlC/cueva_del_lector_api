services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${STAGE:-dev}
    container_name: cueva_del_lector_app
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_URL: postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - /app/node_modules

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: cueva_del_lector_migrate
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_URL: postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:18.6-alpine3.24
    restart: always
    container_name: ${DATABASE_NAME}
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "127.0.0.1:${DATABASE_PORT}:5432"
    volumes:
      - postgres-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-db:
